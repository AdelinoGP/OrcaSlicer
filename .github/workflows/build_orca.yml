# Build, test and package OrcaSlicer (pnp_gui) with xmake + Conan.
#
# Replaces the CMake/deps-superbuild workflow. The deps cache is gone: Conan
# now provisions every third-party dependency, so the cache that matters is
# ~/.conan2, keyed on the dependency inputs rather than on a built deps tree.
#
# Tests run in this job rather than a separate one. They cannot be split:
# build/conan/*/pnp_deps.lua records absolute Conan cache paths, and the test
# binaries bake TEST_DATA_DIR and PROFILES_DIR in as absolute paths, so a
# downstream job on a fresh runner cannot reuse the build tree.
#
# PLATFORM STATUS: only the Windows leg is verified. macOS and Linux have
# never been configured or built with xmake — see xmake/modules/pnp/layout.lua.

on:
  workflow_call:
    inputs:
      os:
        description: Runner image
        required: true
        type: string
      arch:
        description: Target architecture (x64, arm64)
        required: false
        type: string
        default: x64
      verified:
        description: >-
          Whether this platform's xmake build is known to work. Unverified legs
          do not fail the workflow.
        required: false
        type: boolean
        default: false

jobs:
  build_orca:
    name: Build
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ !inputs.verified }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python (for Conan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan and xmake
        shell: bash
        run: |
          set -eu
          pip install --upgrade "conan>=2.31"
          conan profile detect --force || true
          # Pinned prebuilt xmake, placed in a known dir and exported to
          # $GITHUB_PATH. The old shget/psget installers were unusable on CI:
          # they build from source on Windows (5+ min) and only touch dotfiles,
          # which Git-bash steps never source (--noprofile --norc), so later
          # steps failed with "xmake: command not found".
          XMAKE_VERSION=3.1.0
          # GitHub release downloads occasionally 503; retry with backoff.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 5 ] && return 1
              sleep $((n * 5))
            done
          }
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-X64)
              retry curl -fsSL -o /tmp/xmake.zip "https://github.com/xmake-io/xmake/releases/download/v${XMAKE_VERSION}/xmake-v${XMAKE_VERSION}.win64.zip"
              unzip -o -q /tmp/xmake.zip -d /tmp/xmake
              echo "/tmp/xmake/xmake" >> "$GITHUB_PATH"
              ;;
            Linux-X64)
              retry curl -fsSL -o /tmp/xmake "https://github.com/xmake-io/xmake/releases/download/v${XMAKE_VERSION}/xmake-bundle-v${XMAKE_VERSION}.linux.x86_64"
              chmod +x /tmp/xmake
              echo "/tmp" >> "$GITHUB_PATH"
              ;;
            macOS-ARM64)
              retry curl -fsSL -o /tmp/xmake "https://github.com/xmake-io/xmake/releases/download/v${XMAKE_VERSION}/xmake-bundle-v${XMAKE_VERSION}.macos.arm64"
              chmod +x /tmp/xmake
              echo "/tmp" >> "$GITHUB_PATH"
              ;;
            macOS-X64)
              retry curl -fsSL -o /tmp/xmake "https://github.com/xmake-io/xmake/releases/download/v${XMAKE_VERSION}/xmake-bundle-v${XMAKE_VERSION}.macos.x86_64"
              chmod +x /tmp/xmake
              echo "/tmp" >> "$GITHUB_PATH"
              ;;
            *)
              echo "unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libfontconfig1-dev libxkbcommon-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # NSIS with the UAC plugin: xmake's makensis probe compiles a script that
      # !includes UAC.nsh, so a stock NSIS install is rejected even though our
      # specfile deliberately does not use UAC.
      - name: Install NSIS + UAC plugin
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          choco install nsis -y --no-progress
          curl -fsSL -o /tmp/UAC.zip https://nsis.sourceforge.io/mediawiki/images/8/8f/UAC.zip
          unzip -o -q /tmp/UAC.zip -d /tmp/uac
          NSIS="/c/Program Files (x86)/NSIS"
          cp /tmp/uac/UAC.nsh "$NSIS/Include/"
          cp /tmp/uac/Plugins/x86-unicode/UAC.dll "$NSIS/Plugins/x86-unicode/"
          cp /tmp/uac/Plugins/x86-ansi/UAC.dll "$NSIS/Plugins/x86-ansi/"

      # Build the PNP backend: since the layout changed, the bundle step fails
      # the build loudly when no dist exists, so CI must stage one itself. Rust
      # is only needed for this step — the C++ toolchain comes with the runner.
      - name: Install Rust (for pnp_cli)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build (pnp backend)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinch_n_print_cli

      # `cargo xtask dist` (default: developer edition, target/dist/developer/)
      # builds guest WASMs + pnp_cli. wasm-tools must be installed before it
      # runs — the guest freshness gate fails without it.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Stage PNP backend (cargo xtask dist)
        shell: bash
        run: |
          set -eu
          cd pinch_n_print_cli
          cargo xtask dist
          test -f target/dist/developer/pnp_cli.exe || test -f target/dist/developer/pnp_cli

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('conan/conanfile.py', 'conan/profile_host.txt', 'conan/profile_build.txt', 'conan/conan*.lock', 'conan/recipes/**/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ inputs.arch }}-

      - name: Configure
        shell: bash
        # -p windows is mandatory: Git's bundled mingw64 sits in PATH on the
        # Windows runners, and xmake then auto-detects 'mingw' instead of
        # 'windows' (see docs/BUILD_SYSTEM_HANDOFF.md). That misdetection
        # drops the WIN32/_USE_MATH_DEFINES defines (opencascade headers fail
        # on M_PI) and looks for conan-mingw.lock instead of conan.lock.
        run: |
          case "$RUNNER_OS" in
            Windows) PLAT=windows ;;
            macOS)   PLAT=macosx ;;
            Linux)   PLAT=linux ;;
            *)       echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          xmake f -y -p "$PLAT" -m release -a ${{ inputs.arch }} --ccache=n

      # The dependency graph builds from source on a cold cache, which is the
      # memory-hungry part; keep the job count modest so the runner survives it.
      - name: Build
        shell: bash
        run: xmake -j2

      - name: Test
        shell: bash
        run: xmake test

      # Ticket 15 — the live-schema gate. The `[.][live-schema]` Catch2 cases
      # (tests/pnp/test_pnp_config_{translator,keys}.cpp) are the only check
      # that the fork's curated table and its generated PNP page agree with the
      # backend *this build actually ships*. The leading-dot tag keeps them out
      # of `xmake test`'s default selection — they need a real
      # `pnp_cli module config-schema` document, which only exists after the
      # staging step above — so CI runs them explicitly, as a hard gate. They
      # are green as of ticket 09; a failure here is genuine drift a submodule
      # bump introduced, which is the whole point.
      #
      # The GUI itself is not launched: the runners are headless and the
      # rendered controls stay manual smoke. Everything below the wxWidgets
      # layer is covered by these cases.
      - name: Live-schema gate (staged pnp_cli vs the fork's key handling)
        shell: bash
        run: |
          set -eu
          DIST=pinch_n_print_cli/target/dist/developer
          CLI="$DIST/pnp_cli.exe"
          [ -f "$CLI" ] || CLI="$DIST/pnp_cli"
          test -f "$CLI"
          # --module-dir mirrors how PnpBackend invokes the probe. The staged
          # backend also resolves modules relative to its own binary, so this
          # is parity rather than load-bearing; the document's shape is what
          # the gate actually asserts (a manifest-less reply still answers with
          # the host half alone, and the page would silently shrink to it).
          SCHEMA="$PWD/pnp-live-schema.json"
          "$CLI" module config-schema --module-dir "$DIST/modules" > "$SCHEMA"
          BIN=$(find build -type f \
                  \( -name pnp_config_translator_tests -o -name pnp_config_translator_tests.exe \) \
                  | head -n 1)
          test -n "$BIN"
          PNP_LIVE_SCHEMA="$SCHEMA" "$BIN" "[live-schema]"

      - name: Upload live schema document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-live-schema-${{ runner.os }}-${{ inputs.arch }}
          path: pnp-live-schema.json
          if-no-files-found: warn

      - name: Package (portable)
        shell: bash
        run: xmake package

      - name: Package (NSIS installer)
        if: runner.os == 'Windows'
        shell: bash
        run: xmake pack -f nsis

      # Unsigned: this fork has no Apple Developer identity, so there is no
      # codesign / notarytool / stapler step. macOS will require a
      # right-click-Open on first launch. Single-arch by design — the upstream
      # universal binary came from build_release_macos.sh -a universal, which
      # the cutover removed; a lipo combine is a later addition, not a
      # prerequisite for getting one arch to compile.
      - name: Package (dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: xmake dmg

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-${{ runner.os }}-${{ inputs.arch }}-portable
          path: build/package/OrcaSlicer_*
          if-no-files-found: error

      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-Windows-${{ inputs.arch }}-installer
          path: |
            build/xpack/OrcaSlicer/*.exe
            build/xpack/OrcaSlicer/*.sha256
          if-no-files-found: error

      - name: Upload dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-macOS-${{ inputs.arch }}-dmg
          path: build/dist/*.dmg
          if-no-files-found: error
