# OrcaSlicer (pnp_gui) flatpak — LOCAL / CI BUILDS ONLY.
#
# NOT FLATHUB-SUBMITTABLE. The OrcaSlicer module builds with
# `--share=network` so Conan can resolve and build the dependency graph;
# Flathub forbids network access at build time. The upstream manifest avoided
# this by vendoring ~15 dependency archives as flatpak sources and building
# them with cmake through deps/ — both of which the xmake cutover removed.
# Restoring Flathub support means vendoring the sources of all 30 transitive
# Conan packages and teaching Conan to consume them offline, and would need a
# distinct app-id (this one is upstream's).
#
# UNVERIFIED: never built. See docs/adr/0001-xmake-conan-build-system.md.
#
# Build with: scripts/flatpak/build.sh
app-id: com.orcaslicer.OrcaSlicer
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: entrypoint
separate-locales: true
rename-icon: OrcaSlicer
build-options:
  append-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
  env:
    CC: clang
    CXX: clang++
    LDFLAGS: "-fuse-ld=lld"
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/gvfs
  - --filesystem=/run/media
  - --filesystem=/media
  # Network shares (CIFS/NFS) are commonly mounted under /mnt, which the default
  # finish-args don't grant; without it, opening a model from such a share fails
  # with "The file does not contain any geometry data."
  # https://github.com/flathub/com.orcaslicer.OrcaSlicer/issues/2
  - --filesystem=/mnt
  - --filesystem=/run/spnav.sock:ro
  # Allow read-only access to OrcaSlicer's legacy config and cache directories (if they exist) for migration purposes.
  - --filesystem=~/.var/app/io.github.softfever.OrcaSlicer:ro
  # Allow OrcaSlicer to own and talk to instance-check D-Bus names (InstanceCheck.cpp)
  - --talk-name=com.orcaslicer.OrcaSlicer.InstanceCheck.*
  - --own-name=com.orcaslicer.OrcaSlicer.InstanceCheck.*
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=SPNAV_SOCKET=/run/spnav.sock

modules:

  # JPEG codec and GTK video sink (Wayland liveview) for the liveview
  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Djpeg=enabled
      - -Dgtk3=enabled
      - -Ddoc=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.22.8.tar.xz
        sha256: e305b9f07f52743ca481da0a4e0c76c35efd60adaf1b0694eb3bb021e2137e39

  - name: glu
    build-options:
      cxxflags: -Wno-register
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/blfs/conglomeration/glu/glu-9.0.2.tar.xz
        sha256: 6e7280ff585c6a1d9dfcdf2fca489251634b3377bfc33c29e4002466a38d02d4
    cleanup:
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig

  - name: kde-extra-cmake-modules
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KDE/extra-cmake-modules
        tag: v5.249.0
        commit: 008ae77d0cd2a97c346228ab30b99279643e5022
    cleanup:
      - /

  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db

  # UNVERIFIED: this module has never been built. flatpak-builder is not
  # available on the machine the xmake migration was done on.
  - name: OrcaSlicer
    buildsystem: simple
    build-options:
      # Conan resolves and builds the whole dependency graph, which needs the
      # network. This is what the deleted wxWidgets/orca_deps modules avoided
      # by vendoring ~15 archives as flatpak sources.
      #
      # THIS MAKES THE MANIFEST FLATHUB-INCOMPATIBLE. Flathub forbids network
      # access during build. Restoring Flathub support means vendoring the
      # sources of all 30 transitive Conan packages and teaching Conan to
      # consume them offline; see docs/adr/0001-xmake-conan-build-system.md.
      build-args:
        - --share=network
      env:
        CONAN_HOME: /run/build/OrcaSlicer/.conan2
    build-commands:
      # xmake and Conan must be installed into the sandbox: unlike the cmake
      # the previous manifest relied on, the GNOME Sdk provides neither.
      - |
        set -eu
        export PATH="$PWD/.tools/bin:$HOME/.local/bin:$PATH"
        pip3 install --prefix="$PWD/.tools" "conan>=2.31"
        export PYTHONPATH="$(echo "$PWD"/.tools/lib/python*/site-packages)"
        curl -fsSL https://xmake.io/shget.text | bash
        conan profile detect --force
      - |
        set -eu
        export PATH="$PWD/.tools/bin:$HOME/.local/bin:$PATH"
        export PYTHONPATH="$(echo "$PWD"/.tools/lib/python*/site-packages)"
        # --fhs=y + --prefix=/app makes the Linux FHS layout stage exactly the
        # tree this module installs. --pnp_bundle_cli=n because the Rust PNP
        # backend is not built inside the sandbox.
        xmake f -y -m release --fhs=y --prefix=/app --pnp_bundle_cli=n --ccache=n
        xmake -j$FLATPAK_BUILDER_N_JOBS
        xmake package
      - ./scripts/run_gettext.sh
      # The FHS staging roots the tree at <staged>/app/{bin,lib,share}, so its
      # contents drop straight into the flatpak prefix. Same layout module the
      # portable directory and the Windows installer use, so they cannot drift.
      - cp -a build/package/OrcaSlicer_*/app/. /app/

    cleanup:
      - /include

    post-install:

      - | # Desktop integration files
        install -Dm644 -t /app/share/icons/hicolor/scalable/apps/ resources/images/OrcaSlicer.svg
        install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
        desktop-file-edit --set-key=Exec --set-value="entrypoint %U" /app/share/applications/${FLATPAK_ID}.desktop
        install -Dm755 entrypoint /app/bin
        install -Dm755 umount /app/bin

      - install -Dm644 LICENSE.txt /app/share/licenses/${FLATPAK_ID}/LICENSE.txt

      - | # Install fonts into fontconfig-scanned directory so Pango finds them
        # before initialization (avoids ensure_faces crash from AddPrivateFont)
        install -Dm644 -t /app/share/fonts/OrcaSlicer/ resources/fonts/*.ttf
        fc-cache -f /app/share/fonts/OrcaSlicer/

    sources:
      # OrcaSlicer source tree (specific dirs to avoid copying .git from worktree)
      - type: dir
        path: ../../deps_src
        dest: deps_src
      - type: dir
        path: ../../resources
        dest: resources
      - type: dir
        path: ../../src
        dest: src
      - type: dir
        path: ../../localization
        dest: localization
      # xmake build system: the build description, the shared layout module,
      # and the Conan graph. `tests` is needed too — xmake.lua declares the
      # Catch2 targets at description scope with explicit file paths, so the
      # project fails to load without them even though they are never built
      # here (set_default(false)).
      - type: dir
        path: ../../xmake
        dest: xmake
      - type: dir
        path: ../../conan
        dest: conan
      - type: dir
        path: ../../tests
        dest: tests
      # xpack's set_specfile resolves this path when the project loads, even
      # though the NSIS format is never used on Linux.
      - type: dir
        path: ../../installer
        dest: installer

      - type: file
        path: ../../xmake.lua
      - type: file
        path: ../../LICENSE.txt
      # single source of truth for the version; xmake.lua's version_guard rule
      # reads it at build time
      - type: file
        path: ../../version.inc
      - type: file
        path: ../run_gettext.sh
        dest: scripts

      # AppData metainfo for GNOME Software & Co.
      - type: file
        path: com.orcaslicer.OrcaSlicer.metainfo.xml

      # Startup script
      - type: file
        path: entrypoint

      # umount wrapper used to redirect umount calls to UDisks2
      - type: file
        path: umount
